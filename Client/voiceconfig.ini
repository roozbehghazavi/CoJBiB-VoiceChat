# IranCoJ Voice Chat - configuration
# Edit the keys and mode below, then save. Restart the game to apply.

# --- Keys ---
# Use a single letter/number (A-Z, 0-9), F1-F12, or a named key:
#   SPACE, TAB, CTRL, LCTRL, RCTRL, SHIFT, LSHIFT, RSHIFT, ALT, CAPS, ENTER,
#   MOUSE4, MOUSE5, MOUSEMIDDLE
team_key = V      # talk to your team
all_key  = B      # talk to everyone (all-talk)
mute_key = M      # mute / unmute others

# --- Talk mode ---
# ptt    = push-to-talk (hold the key while speaking)   [default]
# toggle = press once to start talking, press again to stop
mode = ptt
